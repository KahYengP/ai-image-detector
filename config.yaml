# Central config: training, data paths, and independently toggleable augmentations.
# Toggle any transform under `augmentations` to run ablations without code changes.

seed: 42

paths:
  cifake: data/raw/cifake
  sid_set: data/raw/sid_set
  wildfake: data/raw/wildfake
  human: train images
  # Extra labeled stills (ai-generated_live / real_live / ai-generated_product).
  human_extra: test-images
  output_dir: outputs
  checkpoint: outputs/best.pt

dataset:
  # cifake | sid_set | wildfake | combined | human
  name: human
  # CIFAKE is 32x32. In combined mode, cap it so high-res SID_Set photos
  # (ordinary camera stills) are the majority of the "real" class.
  combined_cifake_max_per_class: 300
  # Repeat each human-labeled photo this many times so they are not
  # drowned by SID_Set in combined mode. Labels come from the filename prefix.
  human_oversample: 1
  human_val_fraction: 0.15
  human_test_fraction: 0.15
  # Map edited/filtered photos to ~0.5 so they land in filters_or_edited.
  human_soft_labels: true
  # Repeat scarce prefixes (real-blur, edited-filtered) up to 3x in train.
  human_balance_rare: true
  image_size: 224
  # When the source image is larger than image_size, crop instead of downsampling
  # so high-frequency generator artifacts are not destroyed.
  prefer_crop: true
  # SID_Set label 2 = locally tampered; exclude by default (image-level AIGC task).
  sid_set_include_tampered: false
  # Never train on the official demonstration split (COCO val2017 + DALL·E Advanced).
  wildfake_exclude:
    - coco/val2017
    - coco_val2017
    - dalle_advanced
    - dall-e_advanced
    - dalle-advanced
    - dall-e advanced
    - dalle advanced

model:
  clip_name: openai/clip-vit-base-patch32
  # true = adapt the last CLIP block on the 284 human photos. Frozen CLIP
  # under-called AI on this set; CIFAKE-only fine-tunes were the FP risk.
  freeze_except_last_block: true
  use_frequency_branch: true
  dropout: 0.4
  aux_loss_weight: 0.3

train:
  epochs: 16
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.05
  num_workers: 0
  max_samples: null
  val_fraction: 0.15
  # 1.3 = slight extra cost for calling a camera photo AI.
  real_class_weight: 1.3

thresholds:
  # After edited/blur fine-tune: keep edited photos out of likely_ai.
  likely_real_max: 0.28
  likely_ai_min: 0.74
  logit_bias: -0.25
  temperature: 0.75

augmentations:
  enabled: true
  # Probability of running the augmentation stack on a given training image.
  apply_prob: 0.85
  jpeg:
    enabled: true
    qualities: [90, 70, 50, 30]
  blur:
    enabled: true
    sigmas: [0.5, 1.0, 2.0, 3.5]
  resize:
    enabled: true
    scales: [0.5, 0.25]
  noise:
    enabled: true
    sigmas: [0.02, 0.05, 0.10]
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  center_crop:
    enabled: true
    fraction: 0.8

eval:
  max_samples: null
