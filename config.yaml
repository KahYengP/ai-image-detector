# Central config: training, data paths, and independently toggleable augmentations.
# Toggle any transform under `augmentations` to run ablations without code changes.

seed: 42

paths:
  cifake: data/raw/cifake
  sid_set: data/raw/sid_set
  wildfake: data/raw/wildfake
  human: train images
  output_dir: outputs
  checkpoint: outputs/best.pt

dataset:
  # cifake | sid_set | wildfake | combined
  name: combined
  # CIFAKE is 32x32. In combined mode, cap it so high-res SID_Set photos
  # (ordinary camera stills) are the majority of the "real" class.
  combined_cifake_max_per_class: 300
  # Repeat each human-labeled photo this many times so 48 images are not
  # drowned by SID_Set. Labels come from the filename prefix.
  human_oversample: 12
  image_size: 224
  # When the source image is larger than image_size, crop instead of downsampling
  # so high-frequency generator artifacts are not destroyed.
  prefer_crop: true
  # SID_Set label 2 = locally tampered; exclude by default (image-level AIGC task).
  sid_set_include_tampered: false
  # Never train on the official demonstration split (COCO val2017 + DALL·E Advanced).
  wildfake_exclude:
    - coco/val2017
    - coco_val2017
    - dalle_advanced
    - dall-e_advanced
    - dalle-advanced
    - dall-e advanced
    - dalle advanced

model:
  clip_name: openai/clip-vit-base-patch32
  # false = freeze all CLIP weights. Fine-tuning the last block on CIFAKE
  # made ordinary photographs look "not real" (high false-positive rate).
  freeze_except_last_block: false
  use_frequency_branch: true
  dropout: 0.3
  aux_loss_weight: 0.3

train:
  epochs: 3
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 0
  max_samples: null
  val_fraction: 0.1
  # Penalize calling a real photo AI more than missing an AI image.
  # 1.0 = balanced BCE. >1 shifts the operating point toward fewer false positives.
  real_class_weight: 2.5

thresholds:
  # Recalibrated after human-labeled fine-tune. See outputs/calibration.json.
  # likely_real < 0.28; filters_or_edited 0.28-0.70; likely_ai > 0.70.
  likely_real_max: 0.28
  likely_ai_min: 0.70
  logit_bias: 0.45
  temperature: 0.9

augmentations:
  enabled: true
  # Probability of running the augmentation stack on a given training image.
  apply_prob: 0.7
  jpeg:
    enabled: true
    qualities: [90, 70, 50, 30]
  blur:
    enabled: true
    sigmas: [0.5, 1.0, 2.0]
  resize:
    enabled: true
    scales: [0.5, 0.25]
  noise:
    enabled: true
    sigmas: [0.02, 0.05, 0.10]
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  center_crop:
    enabled: true
    fraction: 0.8

eval:
  max_samples: null
